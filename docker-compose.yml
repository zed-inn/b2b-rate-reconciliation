services:
  postgres-node:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_NODE_USER:-node_user}
      POSTGRES_PASSWORD: ${POSTGRES_NODE_PASSWORD:-node_pass}
      POSTGRES_DB: ${POSTGRES_NODE_DB:-booking_ledger}
    ports:
      - "5432:5432"
    volumes:
      - pg_node_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_NODE_USER:-node_user} -d ${POSTGRES_NODE_DB:-booking_ledger}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-django:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_DJANGO_USER:-django_user}
      POSTGRES_PASSWORD: ${POSTGRES_DJANGO_PASSWORD:-django_pass}
      POSTGRES_DB: ${POSTGRES_DJANGO_DB:-audit_db}
    ports:
      - "5433:5432"
    volumes:
      - pg_django_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_DJANGO_USER:-django_user} -d ${POSTGRES_DJANGO_DB:-audit_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}

  api-gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - react-admin
      - fastify-server
      - django-web

  react-admin:
    build:
      context: .
      dockerfile: services/react-admin/Dockerfile

  fastify-server:
    build:
      context: .
      dockerfile: services/fastify-server/Dockerfile
    env_file:
      - ./services/fastify-server/.env
    depends_on:
      postgres-node:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started
      mongodb:
        condition: service_started

  mock-supplier-api:
    build:
      context: .
      dockerfile: services/mock-supplier-api/Dockerfile

  django-web:
    build:
      context: ./services/django-server
      dockerfile: Dockerfile
    env_file:
      - ./services/django-server/.env
    depends_on:
      postgres-django:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  django-consumer:
    build:
      context: ./services/django-server
      dockerfile: Dockerfile
    env_file:
      - ./services/django-server/.env
    command: [ "uv", "run", "manage.py", "consume_events" ]
    depends_on:
      postgres-django:
        condition: service_healthy
      rabbitmq:
        condition: service_started

volumes:
  pg_node_data:
  pg_django_data:
  mongo_data:
