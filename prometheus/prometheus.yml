global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'fastify-server'
    static_configs:
      - targets: ['fastify-server:3000']
  - job_name: 'django-server'
    metrics_path: '/prometheus/metrics'
    static_configs:
      - targets: ['django-web:8000']
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
